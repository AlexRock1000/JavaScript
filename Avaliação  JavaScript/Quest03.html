<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quest 03</title>
</head>
<body>
    <script>
        var salarioInicial = 2500;
        var percentualAumento = 0.1;
        var novoSalario = salarioInicial + (salarioInicial * percentualAumento);
        
        console.log("O salário inicial do funcionário era R$", salarioInicial);
        console.log("Após o aumento de", percentualAumento, "o salário final é R$", novoSalario);
    </script>
</body>
